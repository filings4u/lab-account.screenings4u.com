<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#01122f"><title>Secure Invoice | Workforce</title><link rel="icon" href="/images/fav.png"><script src="https://js.stripe.com/v3/"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#01122f;font:14px/1.55 Arial,sans-serif}.head{background:#01122f;padding:17px 28px}.head img{width:195px;max-height:62px;object-fit:contain}.wrap{max-width:900px;margin:30px auto;padding:0 15px}.card{background:#fff;border:1px solid #d7e3ef;border-radius:14px;overflow:hidden;box-shadow:0 12px 38px #01122f10}.top{padding:29px 32px;border-bottom:1px solid #dae5f0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.top h1{margin:0;font-size:30px}.status{border-radius:22px;background:#eaf3fe;padding:6px 11px;color:#1255a6;font-weight:bold}.details{padding:23px 32px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.details h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#607894;margin:0 0 8px}.details p{margin:4px 0}.right{text-align:right}table{width:100%;border-collapse:collapse}th{background:#eaf1fa;text-align:left;font-size:11px;text-transform:uppercase}td,th{padding:13px 18px;border-bottom:1px solid #e1eaf4}td:last-child,th:last-child{text-align:right}.total{padding:20px 32px;text-align:right;font-size:21px;font-weight:800}.notes{padding:20px 32px;border-top:1px solid #dbe5ef;color:#576e87}.actions{padding:22px 32px;border-top:1px solid #dbe5ef;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.btn{background:#fdc102;border:0;border-radius:8px;color:#01122f;padding:13px 20px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}#message{padding:12px 0;color:#355574}#payment{padding:20px 32px;border-top:1px solid #dbe5ef}#payment button{margin-top:18px}a{color:#0b5aa8}footer{padding:25px;text-align:center;color:#6b809c;font-size:11px}@media(max-width:600px){.top,.details,.actions,.notes,.total{padding:18px}.details{grid-template-columns:1fr}.right{text-align:left}.head img{width:160px}}@media print{.actions,#payment,footer{display:none!important}.wrap{margin:0;max-width:none}.card{box-shadow:none}}
</style></head><body><header class="head"><img src="https://workforce.screenings4u.com/images/logo.png" alt="Workforce"></header><main class="wrap"><article class="card"><section class="top"><div><h1>Invoice</h1><strong id="number"></strong></div><span class="status" id="status">Loading</span></section><section class="details"><div><h2>Bill to</h2><strong id="customer"></strong><p id="title"></p></div><div class="right"><h2>Invoice details</h2><p id="issued"></p><p id="due"></p></div></section><table><thead><tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Amount</th></tr></thead><tbody id="items"></tbody></table><div class="total" id="total"></div><div class="notes" id="terms"></div><div class="actions"><button type="button" class="btn" id="pay" hidden>Pay Invoice Securely</button><button type="button" class="btn" onclick="window.print()">Print Invoice</button><p id="message" role="status" aria-live="polite"></p></div><section id="payment" hidden></section></article></main><footer>© 2026 Workforce. Secure invoicing and payment processing.</footer><script>
(async()=>{'use strict';const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token');const amount=(v,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(Number(v||0));let invoice;
function message(v){$('#message').textContent=v}
async function api(action){if(!id||!token||!/^[a-f0-9-]{36}$/i.test(id)||!/^[a-f0-9]{64}$/i.test(token))throw Error('Invoice link is invalid.');const r=await fetch('https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/invoice-checkout-actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id,token})});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'Unable to load invoice');return data}
async function load(){const d=await api('get'),v=d.invoice;invoice=v;$('#number').textContent=v.invoice_number;$('#status').textContent=v.status;$('#customer').textContent=v.customer_name||'Customer';$('#title').textContent='Workforce supply purchase';$('#issued').textContent='Issued: '+v.issue_date;$('#due').textContent='Due: '+(v.due_date||'On receipt');$('#items').innerHTML=(v.items||[]).map(x=>'<tr><td>'+escape(x.description)+'</td><td>'+escape(x.quantity)+'</td><td>'+amount(x.unit_price,v.currency)+'</td><td>'+amount(x.line_total,v.currency)+'</td></tr>').join('');$('#total').textContent='Balance due: '+amount(v.amount_due,v.currency);$('#terms').textContent=v.terms||'Payment due on receipt.';$('#pay').hidden=!Number(v.amount_due)||['draft','paid','void','uncollectible'].includes(v.status);message(v.status==='void'?'This invoice was voided. No payment is due.':v.status==='draft'?'This invoice is a draft and cannot be paid until approved.':v.status==='paid'?'This invoice has been paid.':'Secure payment is available through Workforce.')}
$('#pay').onclick=async()=>{const button=$('#pay');button.disabled=true;try{message('Loading secure payment…');const d=await api('create_payment'),stripe=Stripe(d.publishableKey),elements=stripe.elements({clientSecret:d.clientSecret});$('#payment').hidden=false;$('#payment').innerHTML='<div id="paymentElement"></div><button class="btn" type="button" id="confirm">Submit Payment</button><p id="paymentError" role="alert"></p>';elements.create('payment').mount('#paymentElement');$('#confirm').onclick=async()=>{const b=$('#confirm');b.disabled=true;try{const outcome=await stripe.confirmPayment({elements,confirmParams:{return_url:location.href},redirect:'if_required'});if(outcome.error)throw Error(outcome.error.message);message('Payment submitted. Your invoice will update once payment is confirmed.');const st=await api('status');if(st.invoice?.status==='paid')await load()}catch(e){$('#paymentError').textContent=e.message}finally{b.disabled=false}};message('Review your payment details before submitting.')}catch(e){message(e.message)}finally{button.disabled=false}};
try{await load()}catch(e){message(e.message);$('#status').textContent='Unavailable'}
})();
</script></body></html>
