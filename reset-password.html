<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create password | Screenings4U Lab Account</title><link rel="stylesheet" href="style.css"></head><body><main class="login"><section class="card" style="width:min(450px,100%)"><div class="eyebrow">screenings4u / Lab Account</div><h1>Create your password</h1><p class="hint">Use the secure account activation link in your email to create a password for your Lab Account.</p><form id="set"><label>New password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="button" type="submit">Create password</button></form><p id="status" class="notice" role="status" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://elpbnytpciqnbexiaebp.supabase.co','sb_publishable_xVI6Mjkk1bNVMGHZCPuK6w_8FSHKdkC',{auth:{storageKey:'s4u_lab_account_auth_v1',detectSessionInUrl:true}});const status=document.getElementById('status');document.getElementById('set').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){status.textContent='Passwords do not match';return}const {data:{session}}=await sb.auth.getSession();if(!session){status.textContent='Activation link expired. Request a new link from support.';return}const {error}=await sb.auth.updateUser({password:a});if(error){status.textContent=error.message;return}status.textContent='Password created. Opening your Lab Account…';location.replace('/')});</script></body></html>
