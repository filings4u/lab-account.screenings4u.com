<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Select portal | screenings4u</title><style>body{font:16px system-ui;background:#f4f7fb;color:#102f55;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{background:white;padding:34px;border-radius:16px;border:1px solid #dce5ef;max-width:480px;width:100%;box-sizing:border-box}a,button{display:block;margin:15px 0;background:#ef6c00;color:white;border:0;border-radius:8px;padding:14px;text-decoration:none;text-align:center;font:700 15px system-ui;cursor:pointer}button{width:100%;background:#102f55}</style><script src="/assets/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="box"><h1>Select your portal</h1><p id="message">Checking your account…</p><a href="/dashboard.html">Lab Account</a><button id="signout">Sign out</button></main><script>(async()=>{const sb=window.S4UGetSupabaseClient(),r=await sb.auth.getUser();if(r.error||!r.data.user){location.replace('/login.html');return}document.getElementById('message').textContent='Signed in as '+(r.data.user.email||'Lab Account user');document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();location.replace('/login.html')}})()</script></body></html>
