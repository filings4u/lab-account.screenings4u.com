<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Support | screenings4u Lab Account</title><link rel="icon" href="/images/fav.png"><link rel="stylesheet" href="/assets/css/portal.css">
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#173552;background:#f4f7fb}body{margin:0;min-height:100vh;background:#f4f7fb;color:#173552}.lab-head{background:#102f55;color:white;padding:18px max(22px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.lab-head a{color:white;text-decoration:none}.lab-head strong{font-size:1.18rem}.lab-main{max-width:1120px;margin:35px auto;padding:0 22px}.lab-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.lab-heading h1{font-size:1.9rem;margin:0}.lab-heading p{color:#5c7187;margin:8px 0 0}.lab-card{background:#fff;border:1px solid #dce5ed;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px #102f550a}.lab-btn{background:#ef6c00;color:white;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.lab-btn.secondary{background:#eaf0f6;color:#102f55}.lab-btn:disabled{opacity:.55;cursor:wait}.lab-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.lab-field{display:block;font-weight:650;margin:14px 0}.lab-field input,.lab-field select,.lab-field textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #b9c9d9;border-radius:8px;padding:11px;font:inherit;background:#fff;color:#183653}.lab-field textarea{min-height:110px;resize:vertical}.lab-list{display:grid;gap:12px}.lab-ticket{display:block;width:100%;text-align:left;background:white;border:1px solid #dce5ed;border-radius:10px;padding:16px;cursor:pointer;color:inherit;font:inherit}.lab-ticket:hover{border-color:#ef6c00}.lab-muted{color:#64788b;font-size:.9rem}.lab-message{border-bottom:1px solid #e4eaf0;padding:13px 0;white-space:pre-wrap;overflow-wrap:anywhere}.lab-error{color:#a52b20}.lab-success{color:#186c47}.lab-hidden{display:none!important}.lab-pill{background:#edf3f8;border-radius:20px;padding:5px 10px;font-size:.8rem}.lab-auth{max-width:450px;margin:50px auto}.lab-loading{padding:28px}@media(max-width:620px){.lab-heading{align-items:flex-start;flex-direction:column}.lab-main{margin:22px auto}.lab-head{padding:16px 22px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body data-portal-page="support"><header class="lab-head"><a href="/dashboard.html"><strong>screenings4u <span style="color:#ff9b39">Lab Account</span></strong></a><span>Support Center</span></header>
<main class="lab-main"><div class="lab-heading"><div><h1>Support</h1><p>Contact our team and track your support requests.</p></div><button id="newTicket" class="lab-btn lab-hidden" type="button">New support ticket</button></div>
<div id="notice" role="status" aria-live="polite"></div>
<section id="loading" class="lab-card lab-loading">Checking your session…</section>
<section id="tickets" class="lab-hidden"><div id="ticketList" class="lab-list" aria-live="polite"></div></section>
<section id="newForm" class="lab-card lab-hidden"><div class="lab-row"><h2>New support ticket</h2><button class="lab-btn secondary" type="button" data-back>Cancel</button></div><form id="createTicket"><label class="lab-field">Subject<input name="subject" maxlength="180" required></label><label class="lab-field">Category<select name="category"><option value="general">General support</option><option value="billing">Billing</option><option value="account">Account access</option><option value="testing">Testing & results</option><option value="technical">Technical issue</option></select></label><label class="lab-field">Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option></select></label><label class="lab-field">Message<textarea name="message" maxlength="10000" required></textarea></label><button class="lab-btn" type="submit">Submit ticket</button></form></section>
<section id="detail" class="lab-card lab-hidden"><div class="lab-row"><button class="lab-btn secondary" type="button" data-back>Back to tickets</button><span id="ticketStatus" class="lab-pill"></span></div><h2 id="ticketTitle"></h2><p id="ticketMeta" class="lab-muted"></p><div id="messages"></div><form id="replyForm"><label class="lab-field">Reply<textarea name="body" maxlength="10000" required></textarea></label><button class="lab-btn" type="submit">Send reply</button></form></section></main>
<script src="/assets/js/lab-support.js"></script></body></html>
